{% assign rows = site.data[include.file] %}
{% if rows and rows.size > 0 %}
<table>
  <thead>
    <tr>
      {% for column in rows[0] %}
        <th>{{ column[0] }}</th>
      {% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in rows %}
      <tr>
        {% for column in row %}
          <td>{{ column[1] }}</td>
        {% endfor %}
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endif %}

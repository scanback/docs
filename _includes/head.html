<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% if page.browser_title %}
  {% seo title=false %}
  <title>{{ page.browser_title }} | {{ site.title }}</title>
{% else %}
  {% seo %}
{% endif %}

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Person",
  "@id": "https://canback.net/docs/about/#person",
  "name": "Staffan Canback",
  "url": "https://canback.net/docs/about/",
  "sameAs": {{ site.social.links | jsonify }},
  "worksFor": {
    "@type": "Organization",
    "@id": "https://tellusant.com/#organization",
    "name": "Tellusant, Inc.",
    "url": "https://tellusant.com/"
  }
}
</script>

{% if page.robots %}
<meta name="robots" content="{{ page.robots }}">
{% endif %}

<link rel="icon" type="image/png" href="{{ '/assets/images/favicon.png' | relative_url }}">

<link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
